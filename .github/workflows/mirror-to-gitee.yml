name: Mirror July to Gitee

on:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions: {}

concurrency:
  group: july-gitee-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
      GITEE_REPOSITORY_URL: https://gitee.com/xiao_someone/july-framework.git
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - name: Check Gitee HTTPS connection
        shell: bash
        run: |
          curl --silent --show-error --connect-timeout 20 --max-time 40 \
            --output /dev/null \
            --write-out 'Gitee HTTP %{http_code}; connect=%{time_connect}s; TLS=%{time_appconnect}s; total=%{time_total}s\n' \
            "${GITEE_REPOSITORY_URL}/info/refs?service=git-receive-pack"

      - name: Fetch source branches and tags
        shell: bash
        run: |
          git init --bare source.git
          git -C source.git fetch --no-tags "$SOURCE_URL" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

      - name: Push branches and tags to Gitee
        shell: bash
        env:
          GITEE_USERNAME: xiao_someone
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          : "${GITEE_TOKEN:?Set the GITEE_TOKEN repository secret}"
          git -C source.git config credential.helper \
            '!f() { printf "%s\n" "username=$GITEE_USERNAME" "password=$GITEE_TOKEN"; }; f'
          timeout 600s git -C source.git -c http.version=HTTP/1.1 push --progress "$GITEE_REPOSITORY_URL" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
